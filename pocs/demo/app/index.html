<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Todo demo</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
  header { background: #1e293b; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; }
  main { max-width: 520px; margin: 32px auto; background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 1px 3px #0002; }
  input, button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; }
  button { background: #2563eb; color: #fff; border: 0; cursor: pointer; }
  button.ghost { background: #e2e8f0; color: #0f172a; }
  ul { padding: 0; list-style: none; }
  li { padding: 8px 0; border-bottom: 1px solid #e2e8f0; display: flex; gap: 8px; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #dc2626; color: #fff; padding: 12px 16px; border-radius: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header><strong>Todos</strong><span id="who"></span></header>
<main>
  <form id="login">
    <h2>Sign in</h2>
    <input id="name" placeholder="Your name"> <button>Sign in</button>
  </form>
  <section id="app" class="hidden">
    <form id="add"><input id="text" placeholder="New todo"> <button>Add</button></form>
    <ul id="list"></ul>
    <button class="ghost" id="report">Export report</button>
  </section>
</main>
<div id="toast" class="toast hidden"></div>
<script>
const $ = (id) => document.getElementById(id);
function render(todos) {
  $("list").replaceChildren(...todos.map((t) => {
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.onchange = () => { li.style.textDecoration = cb.checked ? "line-through" : ""; console.log("toggled", t.id, cb.checked); };
    li.append(cb, t.text);
    return li;
  }));
}
async function enter(name) {
  $("who").textContent = "Signed in as " + name;
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  const todos = await (await fetch("/api/todos")).json();
  console.info("loaded", todos.length, "todos");
  render(todos);
}
$("login").onsubmit = async (e) => {
  e.preventDefault();
  const name = $("name").value;
  await fetch("/api/login", { method: "POST", body: JSON.stringify({ name }) });
  localStorage.setItem("user", name);
  sessionStorage.setItem("visit", String(Date.now()));
  enter(name);
};
$("add").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("text").value;
  $("text").value = "";
  const todo = await (await fetch("/api/todos", { method: "POST", body: JSON.stringify({ text }) })).json();
  console.log("added todo", todo);
  const drafts = JSON.parse(localStorage.getItem("recent") || "[]");
  localStorage.setItem("recent", JSON.stringify([text, ...drafts].slice(0, 3)));
  render(await (await fetch("/api/todos")).json());
};
$("report").onclick = async () => {
  const res = await fetch("/api/report");
  if (!res.ok) {
    console.warn("report failed with", res.status);
    $("toast").textContent = "Export failed — try again later";
    $("toast").classList.remove("hidden");
    setTimeout(() => $("toast").classList.add("hidden"), 2500);
    throw new Error("Report export failed: " + res.status);
  }
};
if (localStorage.getItem("user")) enter(localStorage.getItem("user"));
</script>
</body>
</html>
